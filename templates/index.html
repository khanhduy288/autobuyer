<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách chat Zalo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .controls {
      margin-bottom: 12px;
    }

    button {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #007bff;
      color: white;
      margin-right: 10px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      font-size: 13px;
      color: #555;
    }

    input {
      width: 320px;
      padding: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    ul {
      list-style: none;
      padding: 0;
      max-height: 80vh;
      overflow-y: auto;
    }

    li {
      background: #fff;
      margin-bottom: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      font-size: 14px;
    }

    .index {
      float: right;
      color: #888;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <h2>📋 Danh sách chat Zalo</h2>

  <div class="controls">
    <button id="startBtn">▶️ Start Tool</button>
    <span id="status"></span>
  </div>

  <input
    type="text"
    id="search"
    placeholder="🔍 Tìm tên chat..."
  >

  <ul id="chatList">
    <li>⏳ Đang tải dữ liệu...</li>
  </ul>

  <script>
    const chatListEl = document.getElementById("chatList");
    const searchInput = document.getElementById("search");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");

    let allChats = [];

    // 👉 FETCH FILE JSON TRONG STATIC
    fetch("/static/all_chats.json", { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        if (!Array.isArray(data)) {
          throw new Error("JSON không phải mảng");
        }

        allChats = data
          .map(s => s.trim())
          .filter(s => s.length > 1);

        render(allChats);
      })
      .catch(err => {
        console.error(err);
        chatListEl.innerHTML =
          "<li>❌ Không load được all_chats.json</li>";
      });

    function render(list) {
      chatListEl.innerHTML = "";

      list.forEach((name, idx) => {
        const li = document.createElement("li");
        li.textContent = name;

        const span = document.createElement("span");
        span.className = "index";
        span.textContent = "#" + (idx + 1);

        li.appendChild(span);
        chatListEl.appendChild(li);
      });
    }

    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value.toLowerCase();
      const filtered = allChats.filter(name =>
        name.toLowerCase().includes(keyword)
      );
      render(filtered);
    });

    // ▶️ START TOOL
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      statusEl.textContent = "⏳ Tool đang chạy...";

      try {
        const res = await fetch("/start", {
          method: "POST"
        });

        const data = await res.json();
        statusEl.textContent = "✅ " + data.result;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "❌ Lỗi khi chạy tool";
      } finally {
        startBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
